<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2C46C8">
<meta name="robots" content="noindex,nofollow">
<title>Trening</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trening">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one-column phone app — sticky header, cards per section, fixed bottom tab bar; coach gets a client list then the same tabs plus Plan */
:root{
  --bg:#ECEEF3; --surface:#FFFFFF; --sunk:#E2E5EC; --ink:#141826; --muted:#5B6376; --line:#D3D8E2;
  --accent:#2C46C8; --accent-soft:#DFE4FB; --on-accent:#FFFFFF;
  --good:#0D8A7B; --good-soft:#D6F0EB; --on-good:#FFFFFF; --bad:#C2452D; --bad-soft:#F8DED8; --warn:#B7791F; --warn-soft:#F7EBCF;
  --scrim:rgba(10,12,20,.88);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0F17; --surface:#151A26; --sunk:#1C2231; --ink:#E7EAF2; --muted:#8C94A8; --line:#272E3F;
  --accent:#7088FF; --accent-soft:#1F2850; --on-accent:#0C0F17; --good:#33C2AE; --good-soft:#123430; --on-good:#0C0F17; --bad:#F07A62; --bad-soft:#3A1D18; --warn:#E3A84A; --warn-soft:#3A2D12; --scrim:rgba(0,0,0,.9); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0F17; --surface:#151A26; --sunk:#1C2231; --ink:#E7EAF2; --muted:#8C94A8; --line:#272E3F;
  --accent:#7088FF; --accent-soft:#1F2850; --on-accent:#0C0F17; --good:#33C2AE; --good-soft:#123430; --on-good:#0C0F17; --bad:#F07A62; --bad-soft:#3A1D18; --warn:#E3A84A; --warn-soft:#3A2D12; --scrim:rgba(0,0,0,.9); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);min-height:56px}
.top h1{margin:0;flex:1;min-width:0;font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .role{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.top .role b{color:var(--good);font-weight:600}
.back{border:0;background:var(--sunk);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

main{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px calc(160px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}

.label{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.15;text-wrap:balance}
p{margin:0}

.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px}
.banner b{color:var(--accent)}

/* workout switch */
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;background:var(--sunk);padding:6px;border-radius:calc(var(--r) + 4px)}
.days button{border:0;background:transparent;border-radius:var(--r);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.days button .big{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05}
.days button .sub{font-size:13px;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.days button[aria-pressed="true"] .sub{color:var(--on-accent);opacity:.85}

/* warmup */
.warm ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.warm li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.warm li:first-child{border-top:0}
.chk{appearance:none;-webkit-appearance:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;margin:0;background:var(--surface)}
.chk:checked{background:var(--good);border-color:var(--good)}
.chk:checked::after{content:"";width:7px;height:13px;border:solid var(--surface);border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.warm .wname{flex:1;min-width:0}
.warm .dose{font-family:var(--f-display);font-weight:600;font-size:18px;color:var(--muted);white-space:nowrap}
.warm li.done .wname{color:var(--muted);text-decoration:line-through}
.pill{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-family:var(--f-display);font-weight:600;font-size:17px;white-space:nowrap}
.photo-btn{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:10px;height:36px;padding:0 10px;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--accent)}
.photo-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* exercise */
.ex-head{display:flex;gap:12px;align-items:flex-start}
.ex-n{font-family:var(--f-display);font-weight:700;font-size:15px;width:28px;height:28px;flex:none;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center}
.ex-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ex-last{font-size:13px;color:var(--muted)}
.ex.complete{box-shadow:inset 0 0 0 2px var(--good)}
.ex.complete .ex-n{background:var(--good);color:var(--on-good)}
.sets{display:flex;flex-direction:column;gap:4px}
.set{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center;border-radius:12px;transition:background-color .2s}
.set.done{background:var(--good-soft);border-top-color:transparent;margin-inline:-8px;padding-inline:8px}
.set.done + .set{border-top-color:transparent}
.set-top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px}
.set-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.reps{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;white-space:nowrap}
.reps small{font-size:14px;font-weight:500;color:var(--muted);margin-left:3px}
.done-btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 14px 3px 3px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-height:36px}
.done-btn .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.done-btn .dot::after{content:"";width:6px;height:11px;border:solid transparent;border-width:0 3px 3px 0;transform:translateY(-1px) rotate(45deg)}
.set.done .done-btn{background:var(--good);border-color:var(--good);color:var(--on-good)}
.set.done .done-btn .dot{border-color:var(--on-good)}
.set.done .done-btn .dot::after{border-color:var(--on-good)}
@media (prefers-reduced-motion:no-preference){.set.done .done-btn{animation:pulse .3s ease-out}@keyframes pulse{50%{transform:scale(1.08)}}}
.up-badge{font-size:12px;font-weight:600;color:var(--good)}
.slider-wrap{min-width:0}
.ticks{display:flex;justify-content:space-between;padding:0 6px;font-size:11px;color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;margin:0;background:transparent;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(to right,var(--accent) var(--p),var(--sunk) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-10px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.25)}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--sunk)}
input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.kg{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.kg button{border:0;background:transparent;width:38px;height:44px;font-size:22px;font-weight:500;color:var(--accent)}
.kg input{width:58px;border:0;background:transparent;text-align:center;font-family:var(--f-display);font-weight:700;font-size:22px;padding:0;-moz-appearance:textfield}
.kg input::-webkit-inner-spin-button,.kg input::-webkit-outer-spin-button{-webkit-appearance:none}
.kg span{font-size:12px;color:var(--muted);margin-right:4px}
.rest{grid-column:1/-1;justify-self:start;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--muted);min-height:34px}
.rest svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.rest.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input,.field select,.inp{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);min-height:46px;width:100%}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:420px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grid2 .field input,.grid4 .field input{font-family:var(--f-display);font-weight:600;font-size:20px}
.field .label{display:flex;justify-content:space-between;gap:6px}
.savebar{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.primary{flex:1;min-width:160px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase;padding:12px 16px;min-height:52px;align-self:flex-end}
.ghost{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;font-size:14px;color:var(--muted)}
.ghost.danger{color:var(--bad);border-color:currentColor}
.ghost.acc{color:var(--accent);border-color:var(--accent)}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:14px;padding:4px 0;text-align:left}

/* chips + stats + chart */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1}
.stat .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:2px}
.up{color:var(--good)} .down{color:var(--bad)}
.chart{width:100%;height:auto;display:block}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* progress list */
.phead{display:grid;grid-template-columns:1fr 72px 52px 16px;gap:8px;font-size:11px}
.phead span:nth-child(n+2){text-align:right}
.plist{list-style:none;margin:0;padding:0}
.plist > li{border-top:1px solid var(--line)}
.prow{width:100%;display:grid;grid-template-columns:1fr 72px 52px 16px;gap:8px;align-items:center;border:0;background:transparent;padding:12px 0;text-align:left}
.pname{min-width:0;font-weight:600;font-size:15px;line-height:1.25}
.pval{font-family:var(--f-display);font-weight:700;font-size:20px;text-align:right;white-space:nowrap}
.pval small{font-size:12px;font-weight:500;color:var(--muted);margin-left:2px}
.pdiff{font-family:var(--f-display);font-weight:600;font-size:16px;text-align:right;color:var(--muted)}
.pdiff.up{color:var(--good)} .pdiff.down{color:var(--bad)}
.chev{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.plist li.open .chev{transform:rotate(90deg)}
.plist li.open .pname{color:var(--accent)}
.pdetail{display:flex;flex-direction:column;gap:12px;padding-bottom:16px}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.hist .d{font-family:var(--f-display);font-weight:600;font-size:16px;white-space:nowrap}
.hist .s{font-size:14px;color:var(--muted);min-width:0}
.hist .s b{color:var(--ink);font-weight:600}

/* tables */
.twrap{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 6px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl thead th{border-top:0;font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tbl .dlt{display:block;font-size:11px;color:var(--muted)}

/* diet */
.macro{display:flex;flex-direction:column;gap:6px}
.macro-row{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center}
.bar{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar i.over{background:var(--warn)}
.bar i.ok{background:var(--good)}
.macro-row .mv{font-family:var(--f-display);font-weight:600;font-size:17px;white-space:nowrap}
.macro-row .mv small{color:var(--muted);font-weight:500;font-size:13px}
.kc-big{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1}
.kc-big small{font-size:18px;color:var(--muted);font-weight:500;margin-left:4px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.week .col{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.week .colbar{width:100%;max-width:34px;height:90px;background:var(--sunk);border-radius:6px;position:relative;overflow:hidden}
.week .colbar i{position:absolute;left:0;right:0;bottom:0;background:var(--accent)}
.week .colbar i.ok{background:var(--good)}
.week .colbar .tgt{position:absolute;left:0;right:0;border-top:2px dashed var(--ink);opacity:.35}
.week .wd{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600}
.week .wv{font-size:11px;font-variant-numeric:tabular-nums}
.week .col.sel .wd{color:var(--accent)}

/* coach list */
.clist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.crow{width:100%;border:0;background:var(--surface);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:44px 1fr 18px;gap:12px;align-items:center;text-align:left}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px}
.cname{font-weight:600;font-size:17px;line-height:1.2}
.cmeta{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.cmeta .stale{color:var(--warn)}
.letter{font-family:var(--f-display);font-weight:700;color:var(--muted);font-size:15px;padding:6px 2px 0}
.tag-manual{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:2px}

/* plan editor */
.ed-item{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.ed-item:first-of-type{border-top:0}
.ed-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ed-row .inp{flex:1 1 160px;min-width:0}
.ed-row .inp.sm{flex:0 0 84px}
.ed-row select.inp{flex:0 0 120px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.thumb{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;background:var(--sunk);flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:var(--scrim);color:#fff;font-size:13px;line-height:1;display:grid;place-items:center}
.addph{width:64px;height:64px;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;color:var(--accent);font-size:12px;font-weight:600;text-align:center;cursor:pointer;flex:none}
.addph input{position:absolute;width:1px;height:1px;opacity:0}
.wk-block{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}

.finbar{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:12px;padding:10px 14px;text-align:left;font-weight:600;font-size:15px}
.finbar .dotc{width:12px;height:12px;border-radius:50%;flex:none}
.finbar span.t{flex:1;min-width:0}
.finbar small{font-weight:500;font-size:13px;opacity:.8}
.st-green{background:var(--good-soft);color:var(--ink)} .st-green .dotc{background:var(--good)}
.st-yellow{background:var(--warn-soft);color:var(--ink)} .st-yellow .dotc{background:var(--warn)}
.st-red{background:var(--bad-soft);color:var(--ink)} .st-red .dotc{background:var(--bad)}
.sdot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:0;margin-right:4px}
.sdot.green{background:var(--good)} .sdot.yellow{background:var(--warn)} .sdot.red{background:var(--bad)}
.fin-big{font-family:var(--f-display);font-weight:700;font-size:52px;line-height:1}
.fin-big small{font-size:18px;font-weight:500;color:var(--muted);margin-left:6px}
.coachbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.coachbtns .primary{min-width:0;font-size:18px}
.coachbtns .primary.alt{background:var(--ink);color:var(--surface)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.tl .d{font-family:var(--f-display);font-weight:600;font-size:16px;white-space:nowrap}
.tl .x{min-width:0;font-size:14px}
.tl .x b{font-weight:600}
.tl .x span{color:var(--muted);display:block;font-size:13px}
.tl .pay b{color:var(--good)}

function lastSets(exId){
  const ss=sessions();
  for(let i=ss.length-1;i>=0;i--){ const e=(ss[i].ex||[]).find(x=>x.id===exId); if(e) return {date:ss[i].date, sets:e.sets, key:ss[i].id}; }
  return null;
}
function draftKey(){ return G.cid + ':' + G.wid; }
function draft(){
  const w = curWorkout(); if(!w) return null;
  const k = draftKey();
  let d = G.local.drafts[k];
  if(!d) d = G.local.drafts[k] = {warm:{}, ex:{}, seed:{}, mod:{}, date:today()};
  if(d.date!==today() && !d.touched) d.date=today();
  for(const e of w.ex){
    const n = Math.max(1, Math.min(10, +e.sets||3));
    const l = lastSets(e.id), key = l ? l.key : 'none';
    const cur = d.ex[e.id];
    if(!cur || (!d.mod[e.id] && (d.seed[e.id]!==key || cur.length!==n))){
      d.seed[e.id]=key;
      const R=rng(e);
      let sets;
      if(l){
        sets = Array.from({length:n},(_,i)=>{ const s=l.sets[Math.min(i,l.sets.length-1)]||{}; return {r:Math.min(R.mx,Math.max(R.mn,s.r||lower(e.target))), kg:s.kg||0}; });
        const last=l.sets[l.sets.length-1], mx=Math.max(...l.sets.map(s=>s.kg||0));
        if(e.unit!=='sec' && last && last.r>=upper(e.target) && mx>0){ sets[0].kg=mx; sets[0].up=true; }
      } else sets = Array.from({length:n},()=>({r: e.unit==='sec' ? Math.min(R.mx, lower(e.target)) : Math.min(R.mx, upper(e.target)), kg:0}));
      d.ex[e.id]=sets;
    } else if(cur.length!==n){
      while(cur.length<n) cur.push(clone(cur[cur.length-1]||{r:10,kg:0}));
      cur.length=n;
    }
  }
  return d;
}

/* ================= render ================= */
let isDragging=false;
function render(){
  if(G.role==='loading'){ return; }
  renderChrome();
  let h='';
  if(G.role==='noaccess') h = vNoAccess();
  else if(G.role==='login') h = vLogin();
  else if(G.role==='register') h = vRegister();
  else if(G.role==='coach' && G.coachScreen==='list') h = vCoachList();
  else if(G.role==='coach' && G.coachScreen==='cal') h = vCal();
  else if(G.role==='coach' && G.coachScreen==='fin') h = vFinAll();
  else {
    if(!tabList().includes(G.tab)) G.tab='trening';
    if(G.role==='coach' && !G.preview && G.tab!=='oplaty') h += finBar(G.cid);
    if(G.preview) h += `<div class="banner" style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap"><span>${isMine()?'<b>Mój trening.</b> Zapisy od razu widzi trener.':`Tak widzi aplikację <b>${esc(prof().name)}</b>. Zapisy trafiają do jego danych.`}</span><button class="ghost acc" data-act="preview-off">Wróć do panelu</button></div>`;
      if(G.tab==='trening') h += vTrening();
    else if(G.tab==='plan') h += vPlan();
    else if(G.tab==='wymiary') h += vWymiary();
    else if(G.tab==='progres') h += vProgres();
    else if(G.tab==='dieta') h += vDieta();
    else if(G.tab==='oplaty') h += vFinClient();
  }
  view.innerHTML = h;
  paintRest(); paintWarmTimer();
}

/* ---------- training ---------- */
function setSummary(sets, sec){ return sets.map(s=> s.kg>0 ? `${s.r}×${fmtN(s.kg)}` : `${s.r}`).join(' · ') + (sets.some(s=>s.kg>0)?' kg':(sec?' s':' powt.')); }
function vTrening(){
  const p = plan(), w = curWorkout();
  if(!w) return `<section class="card"><p class="empty">Trener nie ustawił jeszcze treningu.</p></section>`;
  const d = draft();
  let h = '';
  if(G.role==='coach' && !G.preview) h += `<div class="banner" style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap"><span>Wpisujesz trening za: <b>${esc(prof().name)}</b>. Zapis trafi do jego dziennika.</span><button class="ghost acc" data-act="preview-on">Zobacz jako podopieczny</button></div>`;
  h += vUpcoming();
  if(p.workouts.length>1) h += `<div class="days" role="group" aria-label="Wybór treningu">${p.workouts.map(x=>`<button data-act="wk" data-id="${esc(x.id)}" aria-pressed="${x.id===w.id}"><span class="big">${esc(x.name)}</span>${x.sub?`<span class="sub">${esc(x.sub)}</span>`:''}</button>`).join('')}</div>`;
  else h += `<h2>${esc(w.name)}</h2>`;

  const wu = p.warmup || [];
  if(wu.length){
    const doneN = wu.filter(x=>d.warm[x.id]).length;
    h += `<section class="card warm"><div class="card-head"><h2>Rozgrzewka</h2><span class="label num">${doneN}/${wu.length}</span></div><ul>
      ${wu.map(x=>`<li class="${d.warm[x.id]?'done':''}">
        <input type="checkbox" class="chk" id="w-${esc(x.id)}" data-act="warm" data-id="${esc(x.id)}" ${d.warm[x.id]?'checked':''} aria-label="${esc(x.name)}">
        <label class="wname" for="w-${esc(x.id)}">${esc(x.name)}</label>
        ${(x.photos&&x.photos.length) ? `<button class="photo-btn" data-act="photos" data-id="${esc(x.id)}" aria-label="Zdjęcia: ${esc(x.name)}"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>${x.photos.length>1?x.photos.length:''}</button>` : ''}
        ${x.timer ? `<button class="pill num wtimer" data-act="wtimer" data-id="${esc(x.id)}">▶ ${mmss(x.timer)}</button>` : (x.dose ? `<span class="dose num">${esc(x.dose)}</span>` : '')}
      </li>`).join('')}</ul></section>`;
  }

  w.ex.forEach((e,idx)=>{
    const sets=d.ex[e.id], l=lastSets(e.id), R=rng(e);
    h += `<article class="card ex${sets.every(s=>s.done)?' complete':''}" id="ex-${esc(e.id)}">
      <div class="ex-head"><span class="ex-n">${idx+1}</span><div class="ex-title"><h3>${esc(e.name)}</h3>
        <span class="ex-last">Cel: ${sets.length} × ${esc(e.target||'')}${e.unit==='sec'?' s':''} · przerwa ${mmss(restOf(e))}${l?` · ostatnio ${fmtD(l.date)}: ${setSummary(l.sets, e.unit==='sec')}`:''}</span></div>
        ${(e.photos&&e.photos.length) ? `<button class="photo-btn" data-act="photos" data-id="${esc(e.id)}" aria-label="Zdjęcia: ${esc(e.name)}"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>${e.photos.length>1?e.photos.length:''}</button>` : ''}</div>
      <div class="sets">${sets.map((s,i)=>`<div class="set${s.done?' done':''}">
        <div class="set-top"><span class="set-left"><button class="done-btn" data-act="done" data-ex="${esc(e.id)}" data-i="${i}" aria-pressed="${!!s.done}"><span class="dot"></span>Seria ${i+1}</button>${s.up?'<span class="up-badge">↑ max z ost. treningu</span>':''}</span>
          <span class="reps num" id="rv-${esc(e.id)}-${i}">${s.r}<small>${R.u}</small></span></div>
        <div class="slider-wrap"><input type="range" min="${R.mn}" max="${R.mx}" step="${R.st}" value="${s.r}" style="--p:${pct(s.r,R.mn,R.mx)}" id="r-${esc(e.id)}-${i}" data-act="reps" data-ex="${esc(e.id)}" data-i="${i}" aria-label="${e.unit==='sec'?'Czas w sekundach':'Powtórzenia'}, seria ${i+1}">
          <div class="ticks num" aria-hidden="true">${R.tk.map(k=>`<span>${k}</span>`).join('')}</div></div>
        <div class="kg"><button data-act="kg-" data-ex="${esc(e.id)}" data-i="${i}" aria-label="Mniej o 2 kg">−</button>

          <span>kg</span><button data-act="kg+" data-ex="${esc(e.id)}" data-i="${i}" aria-label="Więcej o 2 kg">+</button></div>
        <button class="rest" data-act="rest" data-ex="${esc(e.id)}" data-i="${i}"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>Przerwa <span class="rest-t num" data-def="${mmss(restOf(e))}">${mmss(restOf(e))}</span></button>
      </div>`).join('')}</div></article>`;
  });
  if(!w.ex.length) h += `<p class="empty">Ten trening nie ma jeszcze ćwiczeń.</p>`;
  if(G.role==='coach' && !G.preview) h += `<label class="chkrow"><input type="checkbox" class="chk" id="s-count" data-act="s-count" ${d.noCount?'':'checked'}><span>Trening z trenerem: odlicz 1 opłacone zajęcia</span></label>`;
  h += `<div class="savebar"><label class="field"><span class="label">Data</span><input class="inp" type="date" id="sdate" data-act="sdate" value="${d.date}"></label>
    <button class="primary" data-act="save" ${w.ex.length?'':'disabled'}>Zapisz ${esc(w.name)}</button></div>`;
  return h;
}

/* ---------- bookings + calendar ---------- */
const WD = ['Pn','Wt','Śr','Cz','Pt','So','Nd'];
const CAL = 'Google Calendar';
const pad2 = n => String(n).padStart(2,'0');
const localStr = d => `${isoOf(d)}T${pad2(d.getHours())}:${pad2(d.getMinutes())}:00`;
const hm = d => `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
const fromLocal = s => { const [a,b]=s.split('T'); const [y,m,d]=a.split('-').map(Number); const [H,M]=(b||'0:0').split(':').map(Number); return new Date(y,m-1,d,H,M); };
function wdName(iso){ return WD[(new Date(iso+'T12:00:00').getDay()+6)%7]; }
function upcoming(){
  const now = localStr(new Date());
  return Object.entries(G.data.bookings||{}).map(([id,b])=>({id,...b})).filter(b=>b.end && b.end>now).sort((a,b)=>a.start<b.start?-1:1);
}
function vUpcoming(){
  const coach = G.role==='coach' && !G.preview, up = upcoming();
  if(!up.length && (!coach || !G.mcp)) return '';
  let h = `<section class="card"><div class="card-head"><h2>Najbliższe treningi</h2>${coach&&G.mcp?`<button class="ghost acc" data-act="cal-open" data-pre="${esc(G.cid)}">Umów trening</button>`:''}</div>`;
  if(!up.length) h += `<p class="empty">Brak umówionych treningów.</p>`;
  else h += `<ul class="uplist">${up.map(b=>{ const s=fromLocal(b.start), e=fromLocal(b.end);
    return `<li><span class="when"><b class="num">${wdName(b.start.slice(0,10))} ${fmtD(b.start.slice(0,10))}, ${hm(s)}–${hm(e)}</b>${b.location?`<span>${esc(b.location)}</span>`:''}</span>
      ${coach?`<button class="ghost ${G.confirm==='bk-'+b.id?'danger':''}" data-act="bk-cancel" data-id="${esc(b.id)}" ${G.cal.busy?'disabled':''}>${G.confirm==='bk-'+b.id?'Odwołać?':'Odwołaj'}</button>`:''}</li>`; }).join('')}</ul>`;
  if(!coach && up.length) h += `<p class="note">Zaproszenie przyszło też mailem z Kalendarza Google.</p>`;
  return h + `</section>`;
}
function calErr(e){
  const c = e && e.code;
  if(c==='server_not_connected' || c==='server_not_found') return 'Kalendarz Google nie jest podłączony do Twojego konta Claude. Dodaj go w claude.ai → Ustawienia → Konektory → Google Calendar, a potem stuknij „Odśwież”.';
  if(c==='needs_reauth') return 'Połączenie z Kalendarzem Google wygasło. Połącz go ponownie w claude.ai → Ustawienia → Konektory, a potem stuknij „Odśwież”.';
  if(c==='not_in_manifest' || c==='approval_required' || c==='consent_required') return 'Aplikacja nie ma zgody na Twój Kalendarz Google. Stuknij „Odśwież” i zezwól w okienku claude.ai.';
  if(c==='selection_required') return 'Masz kilka połączeń z Kalendarzem Google. Wybierz jedno w okienku claude.ai i stuknij „Odśwież”.';
  if(c==='blocked_by_policy') return 'Twoja organizacja blokuje to narzędzie Kalendarza Google.';
  if(c==='server_unavailable' || c==='rate_limited') return 'Kalendarz Google chwilowo nie odpowiada. Spróbuj za chwilę.';
  if(c==='tool_error') return 'Kalendarz Google zgłosił błąd: ' + String(e.message||'').slice(0,160);
  if(c==='not_granted' || c==='capability_disabled' || c==='capability_removed') return 'Kalendarz działa tylko w aplikacji otwartej na claude.ai.';
  return 'Nie udało się połączyć z Kalendarzem Google. Stuknij „Odśwież”.';
}
function parseEvents(payload){
  const list = (payload && (payload.events || payload.items)) || [];
  return list.map(ev=>{
    const st=ev.start||{}, en=ev.end||{};
    const title = ev.summary || (ev.visibility==='private' ? 'Prywatne' : '(bez tytułu)');
    if(st.dateTime) return {id:ev.id, title, loc:ev.location||'', s:new Date(st.dateTime), e:new Date(en.dateTime||st.dateTime), allDay:false, free:ev.transparency==='transparent', declined:(ev.attendees||[]).some(a=>a.self && a.responseStatus==='declined')};
    if(st.date) return {id:ev.id, title, loc:ev.location||'', date:st.date, endDate:en.date||st.date, allDay:true, free:ev.transparency==='transparent'};
    return null;
  }).filter(Boolean);
}
function dayEvents(iso){
  const [y,m,d]=iso.split('-').map(Number), d0=new Date(y,m-1,d), d1=new Date(y,m-1,d+1);
  const ev=G.cal.events||[];
  return {
    timed: ev.filter(x=>!x.allDay && x.s<d1 && x.e>d0).sort((p,q)=>p.s-q.s),
    allDay: ev.filter(x=>x.allDay && x.date<=iso && iso<x.endDate || (x.allDay && x.date===iso && x.endDate===x.date))
  };
}
let calToken=0;
async function loadCal(){
  if(!G.mcp) return;
  const C=G.cal, days=weekDates(C.week), tok=++calToken;
  const nx=new Date(days[6]+'T12:00:00'); nx.setDate(nx.getDate()+1);
  C.status='loading'; C.err=null; if(!G.calSilent) render();
  const input={startTime:days[0]+'T00:00:00', endTime:isoOf(nx)+'T00:00:00', pageSize:250, orderBy:'startTime'};
  const run = async ()=>{ let all=[], token=null, n=0;
    do{ const r = await G.mcp.callTool(CAL,'list_events', token?{...input, pageToken:token}:input, {cache:false});
      const p=r.payload||{}; all=all.concat(parseEvents(p)); token=p.nextPageToken||null; n++; }while(token && n<4);
    return all; };
  try{
    let ev;
    try{ ev = await run(); }
    catch(e){ if(e && e.retryable){ await new Promise(r=>setTimeout(r, Math.min(e.retryAfterMs||1500, 8000)+Math.random()*500)); ev = await run(); } else throw e; }
    if(tok!==calToken) return;
    C.events=ev; C.status='ok'; C.loadedWeek=C.week; C.loadedAt=new Date();
  }catch(e){ if(tok!==calToken) return; C.status='error'; C.err=e; }
  render();
}
function findEventId(p){
  if(!p || typeof p!=='object') return null;
  if(typeof p.id==='string') return p.id;
  if(typeof p.eventId==='string') return p.eventId;
  for(const k of ['event','result','data']) if(p[k]){ const x=findEventId(p[k]); if(x) return x; }
  return null;
}
function vCal(){
  const C=G.cal, S=G.local.cal;
  if(!C.week){ C.week=weekDates(today())[0]; C.day=today(); }
  const days=weekDates(C.week);
  if(!days.includes(C.day)) C.day=days[0];
  if(!G.mcp) return `<section class="card"><h2>Kalendarz Google</h2><p>Kalendarz działa, gdy aplikacja jest otwarta na claude.ai, na koncie trenera z podłączonym Kalendarzem Google (claude.ai → Ustawienia → Konektory → Google Calendar).</p></section>`;
  let h = `<section class="card">
    <div class="card-head" style="align-items:center"><button class="ghost" data-act="cal-prev" aria-label="Poprzedni tydzień">←</button>
      <h2 class="num">${fmtD(days[0])} – ${fmtD(days[6])}</h2><button class="ghost" data-act="cal-next" aria-label="Następny tydzień">→</button></div>
    <div class="daychips">${days.map((d,i)=>{ const n=(C.loadedWeek===C.week?dayEvents(d).timed.filter(x=>!x.declined).length:null); return `<button class="chip" data-act="cal-day" data-d="${d}" aria-pressed="${d===C.day}"><span>${WD[i]}</span><b class="num">${+d.slice(8)}</b><i class="num">${n==null?'&nbsp;':n?n+' wyd.':'wolne'}</i></button>`; }).join('')}</div>
    <div class="ed-row"><span class="note" style="flex:1">${C.status==='loading'?'Wczytuję Twój kalendarz…':C.status==='ok'&&C.loadedAt?`Stan z ${hm(C.loadedAt)}. Zielone okienka są wolne.`:''}</span>
      <button class="ghost acc" data-act="cal-refresh" ${C.status==='loading'?'disabled':''}>Odśwież</button></div>
    ${C.status==='error'?`<div class="errbox">${esc(calErr(C.err))}</div>`:''}
  </section>`;

  if(C.loadedWeek===C.week && (C.status==='ok' || C.status==='loading')){
    const [y,m,d] = C.day.split('-').map(Number), now=new Date();
    const {timed, allDay} = dayEvents(C.day);
    const step = Math.max(15, +S.dur||60);
    const blocking = timed.filter(x=>!x.free && !x.declined);
    // free blocks inside working hours, cut into bookable slots
    const items = timed.map(x=>({k:'ev', at:x.s.getTime(), x}));
    let block=null;
    const flush=()=>{ if(block){ items.push({k:'free', at:block.s, block}); block=null; } };
    for(let t=new Date(y,m-1,d,+S.from||7,0); ; ){
      const e=new Date(t.getTime()+step*60000);
      if(e > new Date(y,m-1,d,+S.to||21,0)) break;
      const free = e>now && !blocking.some(x=>x.s<e && x.e>t);
      if(free){ if(!block) block={s:t.getTime(), e:e.getTime(), slots:[]}; block.e=e.getTime(); block.slots.push(t.getTime()); }
      else flush();
      t=e;
    }
    flush();
    items.sort((p,q)=>p.at-q.at || (p.k==='ev'?-1:1));
    let body='';
    items.forEach(it=>{
      if(it.k==='ev'){
        const x=it.x, d0=new Date(y,m-1,d), d1=new Date(y,m-1,d+1);
        const sTxt = x.s<d0 ? '…'+hm(d0) : hm(x.s), eTxt = x.e>d1 ? '24:00…' : hm(x.e);
        const isNow = x.s<=now && x.e>now, past = x.e<=now;
        const tr = /^trening\s*:/i.test(x.title);
        body += `<div class="ev${tr?' tr':''}${x.free||x.declined?' soft':''}${past?' past':''}${isNow?' now':''}"><span class="t num">${sTxt}–${eTxt}</span>
          <span class="ti">${esc(x.title)}${isNow?'<span class="badge">teraz</span>':''}${x.declined?' <span class="lo" style="display:inline">(odrzucone)</span>':''}${x.free?' <span class="lo" style="display:inline">(dostępny)</span>':''}</span>
          ${x.loc?`<span class="lo">${esc(x.loc)}</span>`:''}</div>`;
      } else {
        const bl=it.block, selIn = C.book && bl.slots.includes(C.book.s);
        body += `<div class="freeb"><div class="fh"><span>Wolne</span><b class="num">${hm(new Date(bl.s))}–${hm(new Date(bl.e))}</b></div>
          <div class="fslots">${bl.slots.map(t=>`<button class="fchip num" data-act="cal-pick" data-s="${t}" aria-pressed="${!!(C.book&&C.book.s===t)}" aria-label="Umów trening o ${hm(new Date(t))}">${hm(new Date(t))}</button>`).join('')}</div>
          ${selIn ? bookForm() : `<span class="note">Stuknij godzinę, żeby umówić trening (${step} min).</span>`}</div>`;
      }
    });
    let nowLine='';
    if(C.day===today()){
      const cur = blocking.filter(x=>x.s<=now && x.e>now), next = blocking.filter(x=>x.s>now).sort((p,q)=>p.s-q.s)[0];
      nowLine = `<div class="nowcard">${cur.length?`Teraz: <b>${esc(cur.map(x=>x.title).join(', '))}</b> (do ${hm(cur[0].e)})`:'Teraz jesteś wolny.'}${next?` Następne: <b>${esc(next.title)}</b> o ${hm(next.s)}.`:' Do końca dnia nic więcej.'}</div>`;
    }
    h += `<section class="card"><div class="card-head"><h2>${wdName(C.day)} ${fmtD(C.day)}</h2><span class="label num">${blocking.length} wyd.</span></div>
      ${nowLine}
      ${allDay.length?`<p class="allday">Cały dzień: ${esc(allDay.map(x=>x.title).join(', '))}</p>`:''}
      <div class="agenda">${body || '<p class="empty">Brak wydarzeń i wolnych godzin w ustawionym zakresie.</p>'}</div></section>`;
  }

  h += `<section class="card"><h3>Ustawienia grafiku</h3><div class="grid4" style="grid-template-columns:repeat(3,minmax(0,1fr))">
    <label class="field"><span class="label">Od godz.</span><input class="inp num" type="number" min="0" max="23" id="cs-from" data-act="cs" data-k="from" value="${S.from}"></label>
    <label class="field"><span class="label">Do godz.</span><input class="inp num" type="number" min="1" max="24" id="cs-to" data-act="cs" data-k="to" value="${S.to}"></label>

  return h;
}

async function bookSlot(){
  const C=G.cal, cid=(document.getElementById('bk-client')||{}).value; if(!cid){ toast('Wybierz podopiecznego'); return; }
  const p=G.profiles[cid]; if(!p) return;
  const s=new Date(C.book.s), e=new Date(C.book.s+(+G.local.cal.dur||60)*60000);
  const loc=(G.local.cal.loc||'').trim();
  const input={summary:`Trening: ${p.name}`, startTime:localStr(s), endTime:localStr(e), description:'Trening umówiony w aplikacji treningowej.', notificationLevel:'ALL', guestPermissions:{guestsCanSeeGuests:false, guestsCanInviteOthers:false}};
  if(p.email) input.attendees=[{email:p.email, displayName:p.name}];
  if(loc) input.location=loc;
  C.busy=true; render();
  try{
    const r = await G.mcp.callTool(CAL,'create_event',input);
    const eid = findEventId(r.payload);
    try{ await setDoc(base(cid)+'/bookings/b-'+uid6(), {start:input.startTime, end:input.endTime, eventId:eid, location:loc, ts:Date.now()}); }catch(e2){}

    if(c==='server_unavailable' || c==='upstream_error' || c==='cancelled') toast('Nie wiadomo, czy trening się zapisał. Sprawdzam kalendarz…');

}
async function cancelBooking(id){

/* ---------- finance ---------- */
const zl = n => (Math.round((+n||0)*100)/100).toLocaleString('pl-PL',{minimumFractionDigits:0, maximumFractionDigits:2}) + ' zł';
function finStatus(cid){
  const f=G.fin[cid]||{}, pays=f.payments||[], done=f.done||[];
  const paid=pays.reduce((a,p)=>a+(+p.count||0),0), used=done.length, left=paid-used;
  const cls = left>3 ? 'green' : left>0 ? 'yellow' : 'red';
  const label = !pays.length ? 'Brak wpłat' : left>0 ? `Opłacone: ${left}` : left===0 ? 'Nieopłacone' : `Dług: ${-left}`;
  return {paid, used, left, cls, label, pays, done, last: pays.slice().sort((a,b)=>a.date<b.date?1:-1)[0]};
}
function finBar(cid){
  const f=finStatus(cid);
  const msg = f.cls==='green' ? `Opłacone jeszcze ${f.left} zajęć` : f.cls==='yellow' ? `Opłacone tylko ${f.left} ${f.left===1?'zajęcia':'zajęcia'} w przód` : (f.left<0 ? `Nieopłacone: ${-f.left} zajęć na kredyt` : (f.pays.length ? 'Opłacone zajęcia się skończyły' : 'Brak wpłat'));
  return `<button class="finbar st-${f.cls}" data-act="tab-fin"><i class="dotc" aria-hidden="true"></i><span class="t">${msg}</span><small>Opłaty ›</small></button>`;
}

async function finAddDone(cid, entry){ const f=clone(G.fin[cid])||{payments:[],done:[]}; f.done=(f.done||[]).concat([entry]); try{ await finSave(cid,f); }catch(e){} }

/* ---------- progress ---------- */
function exRows(id){
  const rows=[];
  sessions().forEach(s=>{ const e=(s.ex||[]).find(x=>x.id===id); if(e&&e.sets&&e.sets.length) rows.push({sid:s.id, date:s.date, sets:e.sets, top:Math.max(...e.sets.map(x=>x.kg||0)), reps:e.sets.reduce((a,x)=>a+(x.r||0),0)}); });
  return rows;
}
function vProgres(){
  const p=plan(), ss=sessions();
  let h='';
  p.workouts.forEach(w=>{
    h += `<section class="card"><div class="card-head"><h2>${esc(w.name)}</h2><span class="label num">${ss.filter(s=>s.workout===w.id).length} zapisanych</span></div>
      <div class="phead label"><span>Ćwiczenie</span><span>Teraz</span><span>Zmiana</span><span></span></div><ul class="plist">`;
    w.ex.forEach(e=>{
      const rows=exRows(e.id), useKg=rows.some(r=>r.top>0), sec=e.unit==='sec', unit=useKg?'kg':(sec?'s':'powt.');
      const ys=rows.map(r=>useKg?r.top:r.reps), open=G.progEx===e.id;

      h += `<li class="${open?'open':''}"><button class="prow" data-act="pex" data-id="${esc(e.id)}" aria-expanded="${open}">
        <span class="pname">${esc(e.name)}</span>

        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>`;
      if(open){

            <div class="stat"><span class="label">Start</span><span class="v num">${fmtN(ys[0])}<small>${unit}</small></span></div>
            <div class="stat"><span class="label">Rekord</span><span class="v num">${fmtN(Math.max(...ys))}<small>${unit}</small></span></div>
            <div class="stat"><span class="label">Treningi</span><span class="v num">${rows.length}</span></div></div>
            <span class="label">${useKg?'Najcięższa seria':(sec?'Suma sekund ze wszystkich serii':'Suma powtórzeń ze wszystkich serii')}</span>
            ${chart(rows.map(r=>({date:r.date, y:useKg?r.top:r.reps})), unit)}
            <ul class="hist">${rows.slice().reverse().map(r=>`<li><span class="d num">${fmtD(r.date)}</span><span class="s num">${r.sets.map(x=>`<b>${x.r}</b>${x.kg>0?`×${fmtN(x.kg)}`:''}`).join(' · ')} ${useKg?'kg':unit}</span>

        }
        h += `</div>`;

  if(recent.length) h += `<section class="card"><h3>Ostatnie treningi</h3><ul class="hist">${recent.map(s=>{ const w=p.workouts.find(x=>x.id===s.workout); return `<li><span class="d num">${fmtD(s.date)}</span><span class="s">${esc(w?w.name:(s.workoutName||'Trening'))}${s.by==='coach'?' · z trenerem':''}</span><span></span></li>`; }).join('')}</ul></section>`;
  h += `<p class="note">Stuknij ćwiczenie, żeby zobaczyć wykres i historię. „Zmiana” liczy się od pierwszego zapisanego treningu. Usunięcie wpisu kasuje cały trening z tego dnia.</p>`;

/* ---------- diet ---------- */
function weekDates(iso){ const d=new Date(iso+'T12:00:00'); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return Array.from({length:7},(_,i)=>{ const x=new Date(d); x.setDate(d.getDate()+i); return isoOf(x); }); }

    ${bar(cur.kcal||0, +T.kcal||0)}
    <div class="macro">${MACROS.map(m=>`<div class="macro-row"><span class="label">${m.n}</span>${bar(cur[m.k]||0, +T[m.k]||0)}<span class="mv num">${cur[m.k]!=null?fmtN(cur[m.k]):'—'}<small>${T[m.k]?` / ${T[m.k]} g`:' g'}</small></span></div>`).join('')}</div>
    <div class="grid4">
      <label class="field"><span class="label">kcal</span><input class="inp num" type="number" inputmode="numeric" id="f-kcal" data-act="fval" data-k="kcal" value="${cur.kcal??''}"></label>
      ${MACROS.map(m=>`<label class="field"><span class="label"><span>${m.n}</span><span>g</span></span><input class="inp num" type="number" inputmode="decimal" id="f-${m.k}" data-act="fval" data-k="${m.k}" value="${cur[m.k]??''}"></label>`).join('')}
    </div>
    <button class="primary" data-act="fsave">Zapisz dzień</button>
    ${!T.kcal ? `<p class="note">${coach?'Ustaw cele dzienne w zakładce Plan, żeby widzieć postęp.':'Trener nie ustawił jeszcze celów dziennych.'}</p>`:''}
  </section>`;

  const wk = weekDates(date), vals = wk.map(d=>foodDay(d)), tk=+T.kcal||0;
  const maxV = Math.max(tk*1.2, ...vals.map(v=>v&&v.kcal||0), 1);
  const sum = vals.reduce((a,v)=>a+(v&&v.kcal||0),0), nDays = vals.filter(v=>v&&v.kcal).length;
  const sumP = vals.reduce((a,v)=>a+(v&&v.p||0),0);
  h += `<section class="card"><div class="card-head"><h2>Tydzień</h2><span class="label num">${fmtD(wk[0])} – ${fmtD(wk[6])}</span></div>
    <div class="stats"><div class="stat"><span class="label">Suma</span><span class="v num">${Math.round(sum).toLocaleString('pl-PL')}<small>kcal</small></span></div>
      <div class="stat"><span class="label">Cel tyg.</span><span class="v num">${tk?(tk*7).toLocaleString('pl-PL'):'—'}<small>${tk?'kcal':''}</small></span></div>

    <div class="week">${wk.map((d,i)=>{ const v=vals[i]&&vals[i].kcal||0; const r=tk?v/tk:0;
      return `<button class="col${d===date?' sel':''}" data-act="fpick" data-d="${d}" style="border:0;background:transparent;padding:0" aria-label="${fmtD(d)}: ${v?Math.round(v)+' kcal':'brak wpisu'}">
        <span class="wv num">${v?Math.round(v):''}</span>
        <span class="colbar">${tk?`<span class="tgt" style="bottom:${(tk/maxV*100).toFixed(1)}%"></span>`:''}<i class="${r>=0.9&&r<=1.1?'ok':''}" style="height:${(v/maxV*100).toFixed(1)}%"></i></span>

  const days=[]; Object.values(G.data.food).forEach(m=>Object.entries(m.days||{}).forEach(([d,v])=>days.push({d,...v})));

      ${days.slice(0,30).map(x=>`<tr><td><button class="linkbtn" data-act="fpick" data-d="${x.d}">${fmtD(x.d)}</button></td><td>${x.kcal!=null?Math.round(x.kcal):'—'}</td>${MACROS.map(m=>`<td>${x[m.k]!=null?fmtN(x[m.k]):'—'}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div></section>`;
  } else h += `<p class="empty">Nie ma jeszcze wpisów. Po każdym dniu wpisz kalorie i makro, np. z podsumowania dnia w aplikacji do liczenia kalorii.</p>`;
  return h;
}

/* ---------- chart ---------- */
function chart(pts, unit){
  const W=340,H=170,L=44,R=12,T=14,B=26;
  const ys=pts.map(p=>p.y); let mn=Math.min(...ys), mx=Math.max(...ys);
  if(mn===mx){ mn-=1; mx+=1; } const pad=(mx-mn)*0.12; mn=Math.max(0,mn-pad); mx+=pad;
  const X=i=>pts.length===1?(L+W-R)/2:L+i*(W-L-R)/(pts.length-1);
  const Y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  const ticks=[mn,(mn+mx)/2,mx];
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
  const area=pts.length>1?`${line} L${X(pts.length-1).toFixed(1)},${H-B} L${X(0).toFixed(1)},${H-B} Z`:'';
  const lp=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Wykres, ostatnia wartość ${fmtN(lp.y)} ${unit}">
    ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${(Y(t)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Barlow,system-ui">${fmtN(t)}</text>`).join('')}
    ${area?`<path d="${area}" fill="var(--accent)" fill-opacity=".12"/>`:''}
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="2"/>`).join('')}
    <text x="${X(0).toFixed(1)}" y="${H-6}" text-anchor="${pts.length===1?'middle':'start'}" font-size="11" fill="var(--muted)" font-family="Barlow,system-ui">${fmtD(pts[0].date)}</text>
    ${pts.length>1?`<text x="${W-R}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Barlow,system-ui">${fmtD(lp.date)}</text>`:''}
  </svg>`;
}

/* ================= timers + sound ================= */
const mmss = s => `${Math.floor(s/60)}:${String(Math.max(0,s)%60).padStart(2,'0')}`;
let actx=null, wakeLock=null;
function unlockAudio(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); const o=actx.createOscillator(),g=actx.createGain(); g.gain.value=0; o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+0.01); }catch(e){} }
function beep(){ try{ if(!actx) return; if(actx.state==='suspended') actx.resume(); const t0=actx.currentTime+0.05;
  [880,880,1320].forEach((f,k)=>{ const o=actx.createOscillator(),g=actx.createGain(); o.type='square'; o.frequency.value=f; const t=t0+k*0.38, dur=k===2?0.5:0.22;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.35,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+0.02); }); }catch(e){} }
function wake(on){ try{ if(on && navigator.wakeLock && !wakeLock) navigator.wakeLock.request('screen').then(w=>wakeLock=w).catch(()=>{}); if(!on && wakeLock && !rest && !wt){ wakeLock.release(); wakeLock=null; } }catch(e){} }

let rest=null, restT=null;
function startRest(ex,i){ unlockAudio(); const w=curWorkout(), e=w && w.ex.find(x=>x.id===ex), ms=restOf(e)*1000; rest={ex,i,end:Date.now()+ms,total:ms}; clearInterval(restT); restT=setInterval(tickRest,250); wake(true); tickRest(); }
function stopRest(){ clearInterval(restT); restT=null; rest=null; wake(false); paintRest(); }
function tickRest(){ if(!rest) return; if(rest.end-Date.now()<=0){ beep(); try{navigator.vibrate&&navigator.vibrate([300,150,300,150,500]);}catch(e){} stopRest(); toast('Koniec przerwy, czas na następną serię'); return; } paintRest(); }
function paintRest(){
  const bar=document.getElementById('restbar'), left=rest?Math.max(0,rest.end-Date.now()):0, txt=mmss(Math.ceil(left/1000));
  bar.hidden=!rest;
  if(rest){ document.getElementById('rbtime').textContent=txt; document.getElementById('rbprog').style.width=(left/rest.total*100).toFixed(1)+'%'; }
  document.querySelectorAll('.rest').forEach(b=>{ const on=!!rest&&b.dataset.ex===rest.ex&&+b.dataset.i===rest.i; b.classList.toggle('on',on); b.setAttribute('aria-pressed',String(on)); const t=b.querySelector('.rest-t'); if(t) t.textContent=on?txt:(t.dataset.def||'2:00'); });
}
document.getElementById('restbar').addEventListener('click', e=>{ const b=e.target.closest('button[data-rb]'); if(!b||!rest) return; if(b.dataset.rb==='add'){ rest.end+=30000; rest.total+=30000; paintRest(); } else stopRest(); });

let wt=null, wtT=null;
function toggleWarmTimer(id){
  if(wt && wt.id===id){ clearInterval(wtT); wt=null; wake(false); paintWarmTimer(); return; }
  const item=(plan().warmup||[]).find(x=>x.id===id); if(!item) return;
  unlockAudio(); wt={id, end:Date.now()+item.timer*1000, cid:G.cid, key:draftKey()}; clearInterval(wtT); wake(true);
  wtT=setInterval(()=>{ if(wt.end-Date.now()<=0){ const d=G.local.drafts[wt.key]; if(d){ d.warm[wt.id]=true; saveLocal(); } beep(); try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){} toast(item.name+' zrobione'); clearInterval(wtT); wt=null; wake(false); render(); } else paintWarmTimer(); },250);
  paintWarmTimer();
}
function paintWarmTimer(){
  document.querySelectorAll('.wtimer').forEach(b=>{ const it=(plan().warmup||[]).find(x=>x.id===b.dataset.id); if(!it) return;
    b.textContent = wt && wt.id===b.dataset.id && wt.cid===G.cid ? '❚❚ '+mmss(Math.ceil((wt.end-Date.now())/1000)) : '▶ '+mmss(it.timer); });
}

/* ================= image upload ================= */
async function shrink(file){
  let src;
  try{ src = await createImageBitmap(file); }catch(e){ src = await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=URL.createObjectURL(file); }); }
  const w=src.width, h=src.height, k=Math.min(1, 1400/Math.max(w,h));
  const c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));
}

  if(a==='code-change'){ const v=(document.getElementById('new-code').value||'').trim(); if(v.length<8){ toast('Kod musi mieć co najmniej 8 znaków'); return; }
    try{ await rpc('app_set_coach_code', {auth:AUTH, newcode:v}); AUTH={coach:v}; try{ localStorage.setItem(LS_COACH, v); }catch(e){} toast('Zmieniono kod trenera'); render(); }catch(e){ toast('Nie udało się zmienić kodu'); } return; }
  if(a==='logout'){ try{ localStorage.removeItem(LS_COACH); }catch(e){} AUTH=null; STORE.clear(); syncSince=null; clearInterval(syncTimer); G.role='login'; G.coachScreen='list'; G.cid=null; render(); return; }
  if(a==='self-link'){ const on = prof().selfUid!==G.uid;
    if(on){ const other=selfId(); if(other && other!==G.cid){ try{ await updateDoc(base(other), {selfUid:''}); }catch(e){} } }
    try{ await updateDoc(base(G.cid), {selfUid: on ? G.uid : ''}); toast(on?'Ustawiono jako Twój dziennik':'Odłączono'); }catch(e){} return; }
  if(a==='preview-on'){ G.preview=true; G.tab='trening'; render(); window.scrollTo(0,0); return; }
  if(a==='preview-off'){ G.preview=false; G.tab='trening'; render(); window.scrollTo(0,0); return; }
  if(a==='coach-add'){ const v=(document.getElementById('coach-email').value||'').trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ toast('Wpisz poprawny adres e-mail'); return; }
    const cs=((G.config&&G.config.coaches)||[]).filter(x=>x!==v); cs.push(v);
    try{ await setDoc('lib/config', {coaches:cs}); toast('Dodano trenera'); }catch(e){} return; }
  if(a==='coach-del'){ const cs=((G.config&&G.config.coaches)||[]).slice(); cs.splice(i,1);
    try{ await setDoc('lib/config', {coaches:cs}); toast('Usunięto z listy trenerów'); }catch(e){} return; }
  if(a==='wk'){ G.wid=b.dataset.id; G.local.wid[G.cid]=G.wid; saveLocal(); render(); return; }
  if(a==='photos'){ const it=(plan().warmup||[]).find(x=>x.id===b.dataset.id) || plan().workouts.flatMap(w=>w.ex).find(x=>x.id===b.dataset.id); if(it) openPhotos(it); return; }
  if(a==='wtimer'){ toggleWarmTimer(b.dataset.id); return; }
  if(a==='kg-'||a==='kg+'){ const d=draft(); d.mod[b.dataset.ex]=true; const s=d.ex[b.dataset.ex][i]; s.kg=Math.max(0,Math.round((s.kg+(a==='kg+'?2:-2))*10)/10);
    const inp=document.getElementById(`kg-${b.dataset.ex}-${i}`); if(inp) inp.value=s.kg; saveLocal(); return; }
  if(a==='done'){ const d=draft(); d.mod[b.dataset.ex]=true; const sets=d.ex[b.dataset.ex], s=sets[i]; s.done=!s.done;
    b.setAttribute('aria-pressed',String(s.done)); b.closest('.set').classList.toggle('done',s.done);
    const art=document.getElementById('ex-'+b.dataset.ex); if(art) art.classList.toggle('complete', sets.every(x=>x.done));
    if(s.done){ try{navigator.vibrate&&navigator.vibrate(40);}catch(e){} if(curWorkout().ex.every(x=>d.ex[x.id].every(y=>y.done))) toast('Wszystkie serie zrobione! Zapisz trening'); }
    saveLocal(); return; }
  if(a==='rest'){ if(rest&&rest.ex===b.dataset.ex&&rest.i===i) stopRest(); else startRest(b.dataset.ex,i); return; }
  if(a==='save'){ await saveSession(); return; }

  if(a==='pex'){ G.progEx = G.progEx===b.dataset.id ? null : b.dataset.id; render(); return; }
  if(a==='del-session'||a==='del-meas'){ if(G.confirm===b.dataset.id){ G.confirm=null; if(a==='del-session') finRemoveSession(G.cid, b.dataset.id); await delDoc(base(G.cid)+'/'+(a==='del-session'?'sessions':'meas')+'/'+b.dataset.id); toast('Usunięto'); } else { G.confirm=b.dataset.id; render(); } return; }
  if(a==='mf'){ G.measField=b.dataset.k; render(); return; }
  if(a==='msave'){ const m=G.local.meas[G.cid]; if(!m||!Object.keys(m.v).length){ toast('Wpisz przynajmniej jeden wymiar'); return; }
    const body={date:m.date||today(), ts:Date.now(), v:clone(m.v), by:(G.role==='coach'&&!G.preview)?'coach':'self'};
    delete G.local.meas[G.cid]; saveLocal();
    try{ await setDoc(base(G.cid)+'/meas/m-'+uid6(), body); toast('Pomiar zapisany'); }catch(e){} return; }

  if(a==='fpick'){ G.foodDate=b.dataset.d; render(); window.scrollTo(0,0); return; }
  if(a==='fsave'){ const date=G.foodDate||today(), v={};
    ['kcal','p','c','f'].forEach(k=>{ const el=document.getElementById('f-'+k); const x=el?num(el.value):null; if(x!=null) v[k]=x; });
    if(!Object.keys(v).length){ toast('Wpisz kalorie albo makro'); return; }
    v.ts=Date.now(); v.by=(G.role==='coach'&&!G.preview)?'coach':'self';
    const mk=date.slice(0,7), cur=clone(G.data.food[mk])||{days:{}}; cur.days=cur.days||{}; cur.days[date]=v;
    try{ await setDoc(base(G.cid)+'/food/'+mk, cur);
      const p=prof(); if(!p.lastFood || date>=p.lastFood) updateDoc(base(G.cid), {lastFood:date}).catch(()=>{});
      toast('Dzień zapisany'); }catch(e){} return; }

  /* plan editor */
  if(G.tab!=='plan' || !G.editPlan) return;
  const P=EP();
  if(a==='pw-add'){ P.warmup.push({id:'w'+uid6(), name:'Nowe ćwiczenie', dose:'15×', photos:[]}); markDirty(); render(); }
  else if(a==='pw-del'){ P.warmup.splice(i,1); markDirty(); render(); }
  else if(a==='pw-up'){ [P.warmup[i-1],P.warmup[i]]=[P.warmup[i],P.warmup[i-1]]; markDirty(); render(); }
  else if(a==='pw-delph'){ P.warmup[i].photos.splice(+b.dataset.j,1); markDirty(); render(); }
  else if(a==='pe-delph'){ P.workouts[wi].ex[i].photos.splice(+b.dataset.j,1); markDirty(); render(); }
  else if(a==='pk-add'){ const n=P.workouts.length; if(n>=6){ toast('Maksymalnie 6 dni treningowych'); return; } P.workouts.push({id:'k'+uid6(), name:'Trening '+String.fromCharCode(65+n), sub:'', ex:[]}); markDirty(); render(); }
  else if(a==='pk-del'){ if(G.confirm===b.dataset.key){ G.confirm=null; P.workouts.splice(wi,1); markDirty(); render(); } else { G.confirm=b.dataset.key; render(); } }
  else if(a==='pe-add'){ P.workouts[wi].ex.push({id:'e'+uid6(), name:'Nowe ćwiczenie', sets:3, target:'8–12', photos:[]}); markDirty(); render(); setTimeout(()=>{ const ex=P.workouts[wi].ex[P.workouts[wi].ex.length-1]; const el=document.getElementById('pe-n-'+ex.id); if(el){ el.focus(); el.select(); } },0); }
  else if(a==='pe-del'){ P.workouts[wi].ex.splice(i,1); markDirty(); render(); }
  else if(a==='pe-up'){ const l=P.workouts[wi].ex; [l[i-1],l[i]]=[l[i],l[i-1]]; markDirty(); render(); }
  else if(a==='plan-reset'){ G.editDirty=false; G.editPlan=null; render(); }
  else if(a==='plan-save'){
    P.warmup.forEach(x=>{ x.name=(x.name||'').trim()||'Ćwiczenie'; });
    P.workouts.forEach(w=>{ w.name=(w.name||'').trim()||'Trening'; w.ex.forEach(x=>{ x.name=(x.name||'').trim()||'Ćwiczenie'; }); });
    const body={plan:clone(P), targets:clone(G.editPlan.targets)};
    try{ await setDoc(base(G.cid), Object.assign(clone(prof()), body)); G.editDirty=false; G.editPlan=null; toast('Plan zapisany'); render(); }catch(e){}
  }
  else if(a==='copy-plan'){ const v=document.getElementById('copy-from').value; if(!v){ toast('Wybierz, skąd skopiować plan'); return; }
    const src = v==='__def' ? DEFAULT_PLAN : v==='__tpl' ? (G.template&&G.template.plan) : (G.profiles[v]&&G.profiles[v].plan);
    if(!src){ toast('Ten szablon jest pusty'); return; }
    G.editPlan.plan=clone(src); markDirty(); render(); toast('Plan wczytany. Zapisz, żeby go zachować'); }
  else if(a==='save-tpl'){ try{ await setDoc('lib/template', {plan:clone(P), ts:Date.now()}); toast('Zapisano szablon dla nowych podopiecznych'); }catch(e){} }
});

async function saveSession(){
  const w=curWorkout(), d=draft();
  const countIt = G.role==='coach' && !G.preview && !d.noCount;
  const sid='s-'+uid6();
  const body={workout:w.id, workoutName:w.name, date:d.date||today(), ts:Date.now(), by:(G.role==='coach'&&!G.preview)?'coach':'self',
    warm:Object.keys(d.warm).filter(k=>d.warm[k]),
    ex:w.ex.map(e=>({id:e.id, name:e.name, sets:d.ex[e.id].map(s=>({r:s.r, kg:s.kg, done:!!s.done}))}))};
  const dk=draftKey(); stopRest();
  try{
    await setDoc(base(G.cid)+'/sessions/'+sid, body);
    delete G.local.drafts[dk]; saveLocal(); render();
    if(countIt) await finAddDone(G.cid, {id:'d-'+uid6(), date:body.date, src:'session', sid, note:w.name});
    const p=prof(); if(p && (!p.lastSession || body.date>=p.lastSession)) updateDoc(base(G.cid), {lastSession:body.date}).catch(()=>{});
    toast(w.name+' zapisany'); window.scrollTo(0,0);
  }catch(e){}
}

/* ================= boot ================= */
const LS_COACH='trenerApp.coach', LS_TOKEN='trenerApp.token';
function appUrl(){ return location.origin + location.pathname; }
G.assets = { async upload(blob){
  const dataUrl = await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(blob); });
  const id = await rpc('app_photo_put', {auth:AUTH, body:dataUrl}); PHC[id]=dataUrl; return {url:'ph:'+id};
} };
function onUnauthorized(){
  clearInterval(syncTimer);
  if(AUTH && AUTH.coach){ try{ localStorage.removeItem(LS_COACH); }catch(e){} AUTH=null; STORE.clear(); syncSince=null; G.role='login'; G.loginErr='Kod trenera się zmienił. Wpisz aktualny kod.'; }
  else { G.role='noaccess'; }
  render();
}
function afterSync(){
  if(G.role==='client'){ if(!G.profiles[G.cid]){ G.role='noaccess'; } }
  if(G.role==='coach' && G.coachScreen==='client' && !G.profiles[G.cid]){ G.coachScreen='list'; G.cid=null; }
}
async function enterCoach(code){
  AUTH={coach:code};
  const w = await rpc('app_whoami', {auth:AUTH});
  if(!w || w.role!=='coach') throw Object.assign(new Error('x'),{code:'unauthorized'});
  try{ localStorage.setItem(LS_COACH, code); }catch(e){}
  G.role='coach'; G.coachScreen='list'; G.loginErr='';
  view.innerHTML='<div class="center">Wczytuję podopiecznych…</div>'; renderChrome();
  await sync(); derive(); render(); startSync();
}
async function enterClient(token){
  AUTH={token};
  const w = await rpc('app_whoami', {auth:AUTH});
  if(!w || w.role!=='client') throw Object.assign(new Error('x'),{code:'unauthorized'});
  try{ localStorage.setItem(LS_TOKEN, token); }catch(e){}
  G.cid=w.cid; G.role='client';
  await sync(); derive(); afterSync(); render(); startSync();
}
document.addEventListener('submit', async e=>{
  if(e.target.id!=='login-form') return; e.preventDefault();
  const code=(document.getElementById('coach-code').value||'').trim(); if(!code) return;
  G.loginErr=''; const btn=e.target.querySelector('button'); btn.disabled=true; btn.textContent='Sprawdzam…';
  try{ await enterCoach(code); }
  catch(err){ AUTH=null; G.role='login'; G.loginErr = err.code==='offline' ? 'Brak internetu. Spróbuj ponownie.' : err.code==='too_many' ? 'Za dużo prób. Odczekaj kilka minut.' : 'Nieprawidłowy kod.'; render(); }
});
loadLocal();
(async function boot(){
  const qs = new URLSearchParams(location.search);
  let token = qs.get('k');
  if(!token){ const m = location.hash.match(/k=([A-Za-z0-9_-]{20,})/); if(m) token=m[1]; }
  let saved=null; try{ saved=localStorage.getItem(LS_TOKEN); }catch(e){}
  let code=null; try{ code=localStorage.getItem(LS_COACH); }catch(e){}
  try{
    if(token){ await enterClient(token); return; }
    if(code){ await enterCoach(code); return; }
    if(saved){ await enterClient(saved); return; }
    G.role='login'; render();
  }catch(e){
    if(e.code==='offline'){ view.innerHTML='<div class="center">Brak internetu. Odśwież stronę, gdy połączenie wróci.</div>'; return; }
    if(token || (!code && saved)){ G.role='noaccess'; render(); return; }
    try{ localStorage.removeItem(LS_COACH); }catch(_){}
    AUTH=null; G.role='login'; G.loginErr = code ? 'Kod trenera się zmienił. Wpisz aktualny kod.' : ''; render();
  }
})();
})();
</script>
